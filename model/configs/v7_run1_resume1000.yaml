# V7 Run 1 continuation, checkpoint 1000 -> global iteration 1600.
#
# The original run was externally terminated at ~iter 1020 (90-minute harness
# limit), not by a model failure. No NaN/Inf/Metal error. Checkpoints 200-1000
# are intact. This config completes the ORIGINAL run: 600 local iterations,
# 1000 + 600 = 1600 total.
#
# Only these differ from configs/v7_run1_fixed.yaml:
#   - iters: 600 (the remaining steps; not an extra 1600)
#   - resume_adapter_file: the verified 0001000 checkpoint
#   - adapter_path: a continuation subdirectory, so the original numbered
#     checkpoints 0000200-0001000 are never overwritten. Files there are
#     named by local step: 0000600 == global 1600.
#
# Everything else is the approved recipe: Qwen2.5-1.5B, LoRA rank 16, scale 2.0,
# dropout 0.05, last 16 layers, mask_prompt, AdamW, grad checkpoint,
# max_seq_length 1152, micro-batch 1 + accumulation 4, lr 1.5e-4 cosine over
# 1600 (warmup 50), seed 11.
#
# HONEST LIMITATION: mlx-lm persists adapter weights only. There is no optimizer
# state and no global-step counter to resume. The adapter is loaded with
# load_weights(strict=False); the optimizer starts fresh and the LR schedule
# restarts at local step 0 (warmup 50, cosine configured for 1600 steps but
# stopped at 600). Data order restarts from the seeded shuffle. This is a
# weight-level continuation of the same run, not an exact optimizer-state
# replay.
#
# TRAINING (detached, not yet run): see the launch command in the run log header.

model: "Qwen/Qwen2.5-1.5B-Instruct"
train: true
data: "/Users/theaditronik/Desktop/Flouna engine/flouna/model/data/v7_fixed/training"
fine_tune_type: "lora"
optimizer: "adamw"
num_layers: 16
mask_prompt: true
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
batch_size: 1
grad_accumulation_steps: 4
iters: 600
learning_rate: 1.5e-4
lr_schedule:
  name: "cosine_decay"
  arguments: [1.5e-4, 1600]
  warmup: 50
max_seq_length: 1152
grad_checkpoint: true
val_batches: 2
steps_per_report: 20
steps_per_eval: 200
save_every: 200
adapter_path: "/Users/theaditronik/Desktop/Flouna engine/flouna/model/flouna-lora-v7-run1-fixed/continue-1000"
resume_adapter_file: "/Users/theaditronik/Desktop/Flouna engine/flouna/model/flouna-lora-v7-run1-fixed/0001000_adapters.safetensors"
seed: 11
