# V6 run 2. Continues from the run-1 adapter on the 727-row curriculum built
# by build_v6.py --curriculum-dir: all 193 action rows (the domain has the
# smallest footprint and the sealed 382 cannot measure it), plus 534 sampled
# targeted rows for ride origins/vehicles, dietary, priority, item, shop
# categories, greetings and out_of_scope.
#
# OLD: 2e-4 cosine over 2400 x batch 4, from base, full corpus
# NEW: 8e-5 cosine over 1600 x batch 1 (+accum 4), resumed from run1, 727-row curriculum
# REASON: run 2 is a targeted refinement, so a lower LR and short schedule
# avoid destroying the run-1 model. 1600 micro-batches at batch 1 with accum 4
# = 1600 samples, about 2.2 passes over the curriculum at an effective batch
# of 4. The LoRA recipe and max_seq_length are unchanged so the adapter
# tensors stack; the micro-batch is 1 because batch 2 hits the GPU wired limit
# on the 16 GB M2 at 1152-token sequences.
model: "Qwen/Qwen2.5-1.5B-Instruct"
train: true
data: "/tmp/flouna_v6_run2"
fine_tune_type: "lora"
optimizer: "adamw"
num_layers: 16
mask_prompt: true
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
batch_size: 1
grad_accumulation_steps: 4
iters: 1600
learning_rate: 8.0e-5
lr_schedule:
  name: "cosine_decay"
  arguments: [8.0e-5, 1600]
  warmup: 30
max_seq_length: 1152
grad_checkpoint: true
val_batches: 2
steps_per_report: 20
steps_per_eval: 200
save_every: 200
resume_adapter_file: "/Users/theaditronik/Desktop/Flouna engine/flouna/model/flouna-lora-v6-run1/adapters.safetensors"
adapter_path: "/Users/theaditronik/Desktop/Flouna engine/flouna/model/flouna-lora-v6-run2"
seed: 7
