<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flouna</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #fff9f6;
        color: #3d1c00;
        font-family: sans-serif;

      }
      h1 { font-size: 20px; margin: 0 0 8px; }

        display: block;
        padding: 14px 32px;
        border-radius: 999px;
        background: #e8651a;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }

  <body>
    <h1>You're offline</h1>
