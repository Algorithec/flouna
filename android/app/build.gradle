plugins {
    id "com.android.application"
}

// The upload key is read from keystore.properties in this project's root,
// which is never committed (see .gitignore). Without it, release builds are
// left unsigned and debug builds use the local debug key.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.flouna.app"
    compileSdk 36

    defaultConfig {
        // The package name is permanent once the app is on Google Play. It must
        // match ANDROID_PACKAGE_NAME on the web service, which serves
        // /.well-known/assetlinks.json.
        applicationId "com.flouna.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        resValue "string", "app_name", "Flouna"
        resValue "string", "launch_url", "https://www.flouna.com/home"
        resValue "string", "provider_authority", "com.flouna.app.fileprovider"
        // Tells Android that the app and www.flouna.com belong together; the
        // site's assetlinks.json is the other half.
        resValue "string", "asset_statements",
            '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://www.flouna.com"}}]'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
