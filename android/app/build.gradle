plugins {
    id "com.android.application"
}

// The upload key is read from keystore.properties in this project's root,
// which is never committed (see .gitignore). Without it, release builds are
// left unsigned and debug builds use the local debug key.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.flouna.app"
    compileSdk 36

    defaultConfig {
        // The package name is permanent once the app is on Google Play. It must
        // match ANDROID_PACKAGE_NAME on the web service, which serves
        // /.well-known/assetlinks.json.
        applicationId "com.flouna.app"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.1.0"

        resValue "string", "app_name", "Flouna"
        resValue "string", "launch_url", "https://www.flouna.com/home"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
