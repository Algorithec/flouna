name: CI

# Runs on every PR (into any base branch, so stacked PRs get checked too) and
# on pushes to main. This is the status check to require in branch protection,
# so nothing merges without the server tests and the web lint/build passing.
#
# Deliberately NOT run on pushes to feature branches: those branches already
# get a `pull_request` run, and firing both doubled every job. On the free
# runner tier that starved the queue until jobs were cancelled after ~40
# minutes, which looked like CI failures but was pure contention.
on:
  pull_request:
  push:
    branches: [main]

# One run per ref. A new push supersedes the previous run instead of queueing
# behind it — without this, rapid pushes stack up and compete for runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: No AI attribution
    # Repo rule: no commit is authored or co-authored by Claude, and none
    # carries a session link or "Generated with" line. Checked here because
    # commits arrive from more than one machine and cloud session, and a rule
    # held only by local habit already let two such commits onto main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse commits with Claude as author, committer or co-author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            who=$(git log -1 --format='%an <%ae> / %cn <%ce>' "$c")
            if echo "$who" | grep -qiE 'claude|anthropic'; then
              echo "::error::$c is authored or committed as $who"; bad=1
            fi
            if git log -1 --format='%B' "$c" | grep -qiE '^(co-authored-by:.*(claude|anthropic)|claude-session:)|generated with \[?claude'; then
              echo "::error::$c carries a Claude co-author, session link or generated-with line"; bad=1
            fi
          done
          exit $bad

  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    # A stuck install/test should die quickly, not burn 45 minutes of queue.
    timeout-minutes: 15
    # Test on the active LTS lines we support in dev and prod.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      # `npm install` (not `npm ci`) tolerates the cross-OS optional-native-dep
      # mismatch in the lockfile (e.g. @emnapi binaries present only for some
      # platforms). The committed lockfile still pins versions.
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Typecheck
        run: npm run build
      # The vitest global-setup creates a fresh SQLite test.db via `prisma db
      # push` before the suite runs, so no separate migrate step is needed here.
      - name: Tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db

      # The floors in the harness are the evidence the keyless engine is
      # argued from, and nothing was checking them: `npm test` never ran the
      # harness, so intent accuracy could regress through a green build. Both
      # sets run here, the tuned one and the held out one, against the rule
      # engine rather than a vendor, so the gate costs nothing and needs no key.
      - name: Intent eval (rule engine)
        run: |
          node scripts/eval-intent.mjs --provider demo
          node scripts/eval-intent.mjs --provider demo --set holdout --final
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db
          JWT_ACCESS_SECRET: ci-access-secret-not-used-for-anything-real
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-for-anything-real

  # The ruleset on main requires a check named exactly "Server (typecheck +
  # tests)", but the matrix above reports one per Node version with the version
  # appended, so that name never appeared and every merge was refused. This
  # reports it, and passes only when every matrix run passed.
  server-required:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    needs: server
    if: always()
    steps:
      - run: test "${{ needs.server.result }}" = "success"

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm install` (not `npm ci`) tolerates the cross-OS optional-native-dep
      # mismatch in the lockfile (e.g. @emnapi binaries present only for some
      # platforms). The committed lockfile still pins versions.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          # The build only needs a public API URL placeholder; no secrets in CI.
          NEXT_PUBLIC_API_URL: http://localhost:4000

  android:
    name: Android (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only when the app itself changed: a Gradle build on every web or
      # server PR would queue behind the free runners for nothing. A push
      # whose base cannot be compared (the first push of a branch) builds.
      - name: Skip unless the Android app changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- android 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # The wrapper jar runs on every build machine, so it must be the one
      # Gradle published, not one swapped in a pull request.
      - uses: gradle/actions/wrapper-validation@v4
        if: steps.changed.outputs.run == 'true'
      - uses: actions/setup-java@v4
        if: steps.changed.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 17
      # No upload key here, so the release bundle is unsigned; this proves the
      # project builds, not that it is ready to upload.
      - name: Build the debug app and the release bundle
        if: steps.changed.outputs.run == 'true'
        working-directory: android
        run: ./gradlew --no-daemon --console=plain assembleDebug bundleRelease
